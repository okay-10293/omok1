<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>맞고</title>
<style>
:root{--bg:#0f1419;--panel:#171e28;--fg:#e8eaed;--mut:#8b93a1;--line:#273041;--acc:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
#app{max-width:680px;margin:0 auto;padding:10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:var(--fg);background:#232d3b;border:1px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer}
button.pri{background:var(--acc);color:#04120b;border-color:var(--acc);font-weight:700}
input{font:inherit;color:var(--fg);background:#0b1016;border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center;width:160px}
.lob{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.lob h1{font-size:44px;margin:0}
.code{font-size:56px;font-weight:800;letter-spacing:6px;color:var(--acc)}
.or,.mut{color:var(--mut)}
.err{color:#ff6b6b;margin:0}
.pan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pan.turn{border-color:var(--acc)}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.ph .r{margin-left:auto;color:var(--mut)}
.tag{background:#3a2a10;color:#f5c542;border-radius:6px;padding:0 6px;font-size:13px}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.cg{display:flex;gap:6px;align-items:flex-start;min-height:22px}
.cg em{font-style:normal;color:var(--mut);font-size:12px;width:16px;padding-top:3px}
.ch{display:flex;flex-wrap:wrap;gap:2px}
.mini{width:20px;height:22px;border-radius:4px;border:1.5px solid var(--c);color:var(--c);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mini sup{font-size:8px}
.mid{background:#0c2418;border:1px solid #14402a;border-radius:12px;padding:10px;display:flex;gap:10px;min-height:150px}
.floor{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.side{display:flex;flex-direction:column;gap:6px;align-items:center;width:64px}
.side small{color:var(--mut);font-size:11px}
.card{width:58px;height:88px;border-radius:7px;background:linear-gradient(160deg,#f7efd9,#e8dcba);border:1.5px solid #2b2118;color:#2b2118;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 0;user-select:none;flex:none;overflow:hidden;box-shadow:0 2px 4px #0006}
.card .mo{align-self:flex-start;margin-left:5px;font-size:11px;font-weight:800;color:#8a1c1c;line-height:1.2;position:relative;z-index:2}
.card .art{font-size:30px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 1px 0 #0003)}
.card .tp{width:100%;text-align:center;font-size:11px;font-weight:800;padding:3px 0;background:var(--c);color:#fff;text-shadow:0 1px 0 #0006;position:relative;z-index:2}
.card.kG{border-color:#c9a227;box-shadow:0 0 0 1px #c9a227,0 2px 6px #0008}
.card.kG .tp{color:#2b2118;text-shadow:none}
.card .rib{position:absolute;left:-6px;right:-6px;top:38px;height:14px;background:var(--c);opacity:.92;transform:rotate(-8deg);box-shadow:0 1px 2px #0005}
.card.back{justify-content:center;font-size:16px;font-weight:800;color:#f3e9cf;background:repeating-linear-gradient(45deg,#8a1c1c,#8a1c1c 6px,#741616 6px,#741616 12px)}
.card.can{cursor:pointer}
.card.can:hover{transform:translateY(-6px)}
.card.hit{box-shadow:0 0 0 2px #3ddc9755}
.card.opt{cursor:pointer;box-shadow:0 0 0 3px var(--acc);animation:p 1s infinite alternate}
@keyframes p{to{box-shadow:0 0 0 3px #3ddc9722}}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 0}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;min-height:44px;flex-wrap:wrap}
.msg{font-weight:700}
.log{color:var(--mut);font-size:12px;display:flex;flex-direction:column;gap:2px}
.lost{background:#3a1515;color:#ff9b9b;border-radius:8px;padding:6px 10px;text-align:center}
.kG{--c:#f5c542}.kB{--c:#ff8a3d}.kY{--c:#d9a066}.kH{--c:#ef5350}.kC{--c:#66bb6a}.kF{--c:#42a5f5}.kD{--c:#b0bec5}.kP{--c:#7d8b99}.kS{--c:#ab47bc}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="game.js"></script>
<script>
const { NAMES, TYPE, newGame, viewFor, kname } = Matgo;
const PFX = 'okay-matgo-';
const ART = ['', '🌲', '🌸', '🌷', '🌿', '🪻', '🌹', '🍀', '🌕', '🏵️', '🍁', '🍂', '☔'];
let S = null, V = null, peer = null, conn = null, lost = false;
let ui = { mode: 'menu', code: '', err: '' };
const $ = id => document.getElementById(id);

function push() {
  V = viewFor(S, 0);
  render();
  if (conn && conn.open) conn.send({ v: viewFor(S, 1) });
}

function send(a) {
  if (!V) return;
  if (V.me === 0) {
    if (a.k === 'again') {
      const w = S.result && S.result.winner;
      S = newGame(w == null ? 0 : w);
      push();
    } else if (Matgo.act(S, 0, a)) push();
  } else if (conn && conn.open) conn.send({ a });
}

function host() {
  const code = String(Math.floor(10000 + Math.random() * 90000));
  ui = { mode: 'wait', code, err: '' };
  render();
  peer = new Peer(PFX + code);
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { host(); return; }
    ui = { mode: 'menu', code: '', err: '연결 오류: ' + e.type };
    render();
  });
  peer.on('connection', c => {
    if (conn && conn.open) { c.close(); return; }
    conn = c;
    c.on('open', () => { lost = false; S = S || newGame(0); push(); });
    c.on('data', m => { if (m && m.a && S && Matgo.act(S, 1, m.a)) push(); });
    c.on('close', () => { lost = true; render(); });
  });
}

function join() {
  const code = ($('code').value || '').trim();
  if (!code) return;
  ui = { mode: 'joining', code, err: '' };
  render();
  peer = new Peer();
  peer.on('error', e => {
    ui = { mode: 'menu', code: '', err: e.type === 'peer-unavailable' ? '방을 찾을 수 없어요' : '연결 오류: ' + e.type };
    render();
  });
  peer.on('open', () => {
    conn = peer.connect(PFX + code, { reliable: true });
    conn.on('data', m => { if (m && m.v) { V = m.v; lost = false; render(); } });
    conn.on('close', () => { lost = true; render(); });
  });
}

function card(c, cls, a) {
  return `<div class="card k${c.k} ${cls || ''}" title="${NAMES[c.m]}" ${a ? `data-a="${a}" data-id="${c.id}"` : ''}><div class="mo">${c.m}월</div>${'HCFD'.includes(c.k) ? '<div class="rib"></div>' : ''}<div class="art">${ART[c.m]}</div><div class="tp">${kname(c)}</div></div>`;
}

function caps(cs) {
  return ['광', '열', '띠', '피'].map(t => {
    const a = cs.filter(c => TYPE[c.k] === t).sort((x, y) => x.m - y.m);
    return `<div class="cg"><em>${t}</em><div class="ch">${a.map(c => `<div class="mini k${c.k}" title="${c.m}월 ${kname(c)}">${c.m}${c.k === 'S' ? '<sup>2</sup>' : ''}</div>`).join('')}</div></div>`;
  }).join('');
}

function lobby() {
  if (ui.mode === 'wait') return `<div class="lob"><h1>맞고</h1><div class="mut">친구에게 이 코드를 알려주세요</div><div class="code">${ui.code}</div><div class="mut">입장하면 자동으로 시작해요</div></div>`;
  if (ui.mode === 'joining') return `<div class="lob"><h1>맞고</h1><div class="mut">접속 중…</div></div>`;
  return `<div class="lob"><h1>맞고</h1><button class="pri" data-a="host">방 만들기</button><div class="or">또는</div><input id="code" inputmode="numeric" maxlength="5" placeholder="방 코드"><button data-a="join">입장</button>${ui.err ? `<p class="err">${ui.err}</p>` : ''}</div>`;
}

function render() {
  const app = $('app');
  if (!V) { app.innerHTML = lobby(); return; }
  const v = V, me = v.me, o = 1 - me;
  const over = v.phase === 'over';
  const myTurn = v.turn === me && !over;
  const picking = myTurn && (v.phase === 'pickPlay' || v.phase === 'pickDraw');
  const opts = picking ? v.pend.opts : [];
  const canPlay = myTurn && v.phase === 'play';

  let msg;
  if (over) {
    const r = v.result;
    if (r.winner == null) msg = '무승부';
    else if (r.winner === me) msg = `승리! ${r.base}점${r.go ? ` + ${r.go}고` : ''} → ${r.pts}점`;
    else msg = `패배… 상대 ${r.pts}점`;
  } else if (!myTurn) msg = '상대 차례…';
  else if (v.phase === 'play') msg = '낼 패를 고르세요';
  else if (picking) msg = '가져갈 바닥 패를 고르세요';
  else if (v.phase === 'goStop') msg = `${v.sc[me]}점! 고 / 스톱`;
  else msg = '';

  const shown = v.phase === 'pickPlay' ? v.pend.card : v.drawn;
  const shownLabel = v.phase === 'pickPlay' ? '낸 패' : '뒤집은 패';

  const panel = (i, name, extra) => `<div class="pan ${v.turn === i && !over ? 'turn' : ''}"><div class="ph"><b>${name}</b><span>${v.sc[i]}점</span>${v.go[i] ? `<span class="tag">${v.go[i]}고</span>` : ''}<span class="r">${extra}</span></div><div class="caps">${caps(v.cap[i])}</div></div>`;

  app.innerHTML =
    (lost ? '<div class="lost">연결이 끊겼어요</div>' : '') +
    panel(o, '상대', `손패 ${v.oppN}장`) +
    `<div class="mid"><div class="floor">${v.floor.map(c => card(c, opts.includes(c.id) ? 'opt' : '', opts.includes(c.id) ? 'pick' : '')).join('')}</div>` +
    `<div class="side"><div class="card back">${v.deckN}</div>${shown ? `<small>${shownLabel}</small>${card(shown)}` : ''}</div></div>` +
    panel(me, '나', '') +
    `<div class="hand">${v.hand.map(c => card(c, (canPlay ? 'can ' : '') + (v.floor.some(f => f.m === c.m) ? 'hit' : ''), canPlay ? 'play' : '')).join('')}</div>` +
    `<div class="bar"><span class="msg">${msg}</span>` +
    (myTurn && v.phase === 'goStop' ? '<button data-a="go">고</button><button class="pri" data-a="stop">스톱</button>' : '') +
    (over && me === 0 ? '<button class="pri" data-a="again">한 판 더</button>' : '') +
    (over && me === 1 ? '<span class="mut">방장이 다시 시작하면 이어져요</span>' : '') +
    `</div><div class="log">${v.log.slice(-4).map(l => `<div>${l}</div>`).join('')}</div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.dataset.a;
  if (a === 'host') host();
  else if (a === 'join') join();
  else send({ k: a, id: t.dataset.id != null ? +t.dataset.id : undefined });
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('code')) join(); });
render();
</script>
</body>
</html>
